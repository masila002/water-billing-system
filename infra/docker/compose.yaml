services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: majibill
      POSTGRES_PASSWORD: majibill
      POSTGRES_DB: majibill
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: ../apps/api
    environment:
      DATABASE_URL: postgres://majibill:majibill@postgres:5432/majibill
      REDIS_URL: redis://redis:6379
      PORT: 4000
      HOST: 0.0.0.0
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
