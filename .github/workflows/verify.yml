name: Verify demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build MajiBill (root takeover)
        run: npm run build

      - name: Run MajiBill domain tests
        run: npm test

      - name: Run MajiBill gates
        run: npm run gates

      - name: Build demo (isolated)
        run: npm run demo:build

      - name: Run demo tests
        run: npm run demo:test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests (demo)
        run: npm run demo:e2e -- --reporter=line,html --global-timeout=300000
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: warn

  integration:
    name: Backend integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend integration tests
        # Spins a disposable postgres:16-alpine container on loopback,
        # provisions restricted roles plus schema, and exercises the real
        # API. Fails when Docker is unavailable; never skips silently.
        run: npm run test:integration

      - name: Run backend integration tests under Africa/Nairobi time
        # Regression guard for timezone-sensitive date handling (bill
        # replay compares calendar days). Same suite, non-UTC runtime.
        run: npm run test:integration
        env:
          MB_TEST_TZ: Africa/Nairobi
